; Runs on the DB node, next to Postgres. Add the node's private address to
; listen_addr so the app node can reach it (see "Two-node layout" in README.md).
[databases]
acpwb = host=127.0.0.1 port=5432 dbname=acpwb

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 60
reserve_pool_size = 10
reserve_pool_timeout = 3
client_idle_timeout = 30
idle_transaction_timeout = 30
server_reset_query = DISCARD ALL
admin_users = postgres
log_connections = 0
log_disconnections = 0
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
unix_socket_dir = /var/run/postgresql
