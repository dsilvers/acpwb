services:
  db:
    image: timescale/timescaledb:latest-pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: acpwb
      POSTGRES_USER: acpwb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acpwb_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpwb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./acpwb
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py loaddata fortune500 --app public 2>/dev/null || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gevent --workers 4 --worker-connections 100 --timeout 60"
    volumes:
      - ./acpwb:/app
      - ./acpwb/staticfiles:/app/staticfiles
      - hf_cache:/root/.cache/huggingface
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  ws:
    build:
      context: ./ws_service
    environment:
      REDIS_URL: redis://redis:6379/0
      WS_PORT: "8765"
      STREAM_WS_TOKEN: ${STREAM_WS_TOKEN:-}
    expose:
      - "8765"
    volumes:
      # Agent classification uses Django's own patterns (see ws_server._load_bot_classify).
      - ./acpwb/apps/core/bot_classify.py:/app/bot_classify.py:ro
      - ./acpwb/apps/core/traffic_signals.py:/app/traffic_signals.py:ro
    depends_on:
      - redis
    restart: unless-stopped

  botseed_ws:
    build:
      context: ./botseed_service
    environment:
      REDIS_URL: redis://redis:6379/0
      WS_PORT: "8766"
      API_PORT: "8767"
      BOTSEED_WS_TOKEN: ${BOTSEED_WS_TOKEN:-}
    ports:
      - "127.0.0.1:8766:8766"
      - "127.0.0.1:8767:8767"
    depends_on:
      - redis
    restart: unless-stopped

  acpwb_go:
    build:
      context: ./acpwb_go
    environment:
      REDIS_URL: redis://redis:6379/0
      LISTEN_ADDR: 0.0.0.0:8091
      ACCESS_LOG: "1"
    expose:
      - "8091"
    depends_on:
      - redis
    restart: unless-stopped

  botseed_processor:
    build:
      context: ./acpwb
      dockerfile: Dockerfile
    command: python manage.py botseed_processor
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # TLS termination, JA4/JA3/JA4H/HTTP2 fingerprinting, routing, static
  # files and gzip — the same binary that fronts production in place of
  # nginx. EDGE_DEV serves a self-signed cert for acpwb.com / *.acpwb.com /
  # acpwb.example / localhost; :8090 serves botseed.net over plain HTTP.
  edge:
    build:
      context: ./acpwb_edge
    environment:
      EDGE_DEV: "1"
      EDGE_HTTPS_ADDR: ":8001"
      EDGE_HTTP_ADDR: ":8090"
      EDGE_PLAIN_BOTSEED: "1"
      EDGE_DJANGO_UPSTREAM: web:8000
      EDGE_GO_UPSTREAM: acpwb_go:8091
      EDGE_WS_UPSTREAM: ws:8765
      EDGE_BOTSEED_WS_UPSTREAM: botseed_ws:8766
      EDGE_BOTSEED_API_UPSTREAM: botseed_ws:8767
      EDGE_STATIC_ROOT: /app/staticfiles
      EDGE_BOTSEED_ROOT: /botseed
      REDIS_URL: redis://redis:6379/0
      EDGE_DEBUG_ADDR: ":6061" # /debug/vars + pprof; published to localhost only
      EDGE_COOKIE_SECRET: dev-only-not-secret # signs the acpwb_cid client cookie
      EDGE_ASN_DB: /geoip/GeoLite2-ASN.mmdb # client network classification; absent = "unknown"
    volumes:
      - ./acpwb/staticfiles:/app/staticfiles:ro
      - ./botseed:/botseed:ro
      - ./acpwb/var/geoip:/geoip:ro
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:6061:6061"
    depends_on:
      - web
      - ws
      - botseed_ws
      - acpwb_go
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
