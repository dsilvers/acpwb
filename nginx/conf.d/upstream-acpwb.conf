# Keepalive pool to gunicorn — avoids opening a fresh TCP connection per
# request. Install to /etc/nginx/conf.d/upstream-acpwb.conf.
# Referenced by nginx/acpwb.com as `proxy_pass http://django_backend;`.
# Gunicorn (acpwb-gunicorn.service) binds a unix socket, not TCP — matches
# --bind unix:/run/acpwb-gunicorn/gunicorn.sock in that unit.
upstream django_backend {
    server unix:/run/acpwb-gunicorn/gunicorn.sock;
    keepalive 128;
}

# acpwb_go serves the highest-traffic honeypot pages (archive/policy day-
# level content) directly, bypassing Django/gunicorn for these routes — see
# /Users/dan/.claude/plans/realistically-what-can-we-zippy-wave.md. Started
# by the acpwb-go systemd unit (deploy/acpwb-go.service).
upstream acpwb_go {
    server 127.0.0.1:8091;
    keepalive 64;
}

# Classifies $host as an archive-subdomain (archives-YYYY.acpwb.com) for the
# day-level routing in nginx/acpwb.com — mirrors
# apps/core/subdomain_middleware.py's ARCHIVE_SUBDOMAIN_RE. Only the
# day-level content path is cut over to acpwb_go; the subdomain root
# (archive index) and month index still go to Django, so this only needs a
# yes/no signal, not the captured year (acpwb_go derives the year itself
# from the Host header).
map $host $archive_era_subdomain {
    default 0;
    "~*^archives-\d{4}\.acpwb\.com(:\d+)?$" 1;
}

# Classifies $host as a policy-agency subdomain (policy-<agency>.acpwb.com)
# for the year/month/detail routing in nginx/acpwb.com — mirrors
# apps/core/subdomain_middleware.py's POLICY_SUBDOMAIN_RE. Only content
# pages (year/month/detail) are cut over to acpwb_go; the subdomain root
# (policy-sub-index, robots.txt, sitemap.xml) stays on Django — acpwb_go's
# policySubdomainHandler doesn't implement those paths, and per the same
# scoping decision already applied to archive subdomains, index-level pages
# aren't the traffic driver worth cutting over.
map $host $policy_subdomain {
    default 0;
    "~*^policy-[a-z0-9][a-z0-9\-]*\.acpwb\.com(:\d+)?$" 1;
}
