services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: acpwb
      POSTGRES_USER: acpwb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acpwb_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpwb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./acpwb
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py loaddata fortune500 --app public 2>/dev/null || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 17 --threads 4 --timeout 60"
    volumes:
      - ./acpwb:/app
      - ./acpwb/staticfiles:/app/staticfiles
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  ws:
    build:
      context: ./ws_service
    environment:
      REDIS_URL: redis://redis:6379/0
      WS_PORT: "8765"
      STREAM_WS_TOKEN: ${STREAM_WS_TOKEN:-}
    expose:
      - "8765"
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./acpwb/staticfiles:/app/staticfiles:ro
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - web
      - ws

volumes:
  postgres_data:
