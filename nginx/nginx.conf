
events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile    on;
tcp_nopush  on;
tcp_nodelay on;

keepalive_timeout 30s;

# Gzip — compresses HTML, JSON, XML, CSS, JS in transit.
# Significant win for the archive/wiki/report pages and the trap sitemaps.
gzip              on;
gzip_comp_level   4;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/atom+xml
    application/rss+xml;

upstream django {
    server web:8000;
    keepalive 64;  # bumped from 32 to match increased gunicorn worker count
}

# acpwb_go serves the highest-traffic honeypot pages (archive, eventually
# policy) directly, bypassing Django/gunicorn/gevent for these routes — see
# /Users/dan/.claude/plans/realistically-what-can-we-zippy-wave.md.
upstream acpwb_go {
    server acpwb_go:8091;
    keepalive 64;
}

upstream ws_service {
    server ws:8765;
}

upstream botseed_ws {
    server botseed_ws:8766;
}

upstream botseed_api {
    server botseed_ws:8767;
}

# Custom log format that includes the virtual host ($host) so archive subdomain
# traffic is distinguishable from main-domain traffic in access logs.
log_format acpwb '$remote_addr - $remote_user [$time_local] "$host" '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';

# Classifies $host as an archive-subdomain (archives-YYYY.acpwb.com/.example)
# for the day-level routing below — mirrors
# apps/core/subdomain_middleware.py's ARCHIVE_SUBDOMAIN_RE. Only the day-level
# content path is cut over to acpwb_go; the subdomain root (archive index)
# and month index still go to Django, so this only needs a yes/no signal,
# not the captured year (acpwb_go's own Host-based routing derives the year
# itself).
map $host $archive_era_subdomain {
    default 0;
    "~*^archives-\d{4}\.acpwb\.(com|example)(:\d+)?$" 1;
}

server {
    listen 80;
    # Wildcard: accepts acpwb.com, www.acpwb.com, archives-YYYY.acpwb.com, and any other subdomain.
    # Host header is passed through to Django, which handles per-subdomain routing via SubdomainMiddleware.
    # Production: host nginx also needs *.acpwb.com in server_name and a wildcard TLS cert
    # (certbot DNS-01 challenge via cloudflare plugin — see docs/wildcard-tls.md).
    server_name acpwb.com www.acpwb.com *.acpwb.com localhost 127.0.0.1;
    client_max_body_size 10M;

    # Buffered logging — flushes every 5s instead of a syscall per request
    access_log /var/log/nginx/access.log acpwb buffer=16k flush=5s;

    # Traffic graphs — regenerated every 30 min by precalc_dashboard cron; never cache
    location /static/graphs/ {
        alias /app/staticfiles/graphs/;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /ws/requests/ {
        proxy_pass http://ws_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Pass .well-known through to Django (not cached — honeypot logging)
    location /.well-known/ {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # Archive day-level trap pages (/archive/<year>/<month>/<day>[/<slug>][/])
    # are served by acpwb_go — the highest-volume archive content. This is
    # narrower than /archive/ itself: the index (/archive/) and year index
    # (/archive/<year>/) still fall through to Django below.
    location ~ "^/archive/\d{4}/\d{1,2}/\d{1,2}(/|$)" {
        proxy_pass http://acpwb_go;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # CSV export isn't ported to acpwb_go — must be excluded from, and so
    # checked BEFORE, the day-level archive-era location below (which would
    # otherwise also match .../export.csv, since it only anchors the
    # month/day prefix). nginx picks the first matching regex location in
    # file order, not the longest, so this ordering is load-bearing.
    location ~ "^/\d{1,2}/\d{1,2}/.*export\.csv$" {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Archive-subdomain day-level content (archives-YYYY.acpwb.com/<month>/<day>/[<slug>/])
    # is served by acpwb_go. The subdomain root (archive index) and month
    # index ($archive_era_subdomain is still 1 there, but the path shape
    # never matches this regex, e.g. "/" or "/06/") keep going to Django,
    # as does this exact path shape on hosts OTHER than an archive subdomain
    # (e.g. archive_trap_yearless on the main domain, "/06/15/<slug>/") —
    # the $archive_era_subdomain check below is what makes that distinction,
    # not the path regex alone.
    location ~ "^/\d{1,2}/\d{1,2}(/|$)" {
        if ($archive_era_subdomain = 0) {
            proxy_pass http://django;
            break;
        }
        proxy_pass http://acpwb_go;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # Public policy pages (index/year/month/detail) are served by acpwb_go —
    # the other bulk-content honeypot surface alongside archives. Subdomain
    # policy rendering (policy-<agency>.acpwb.com) is not yet ported and
    # still falls through to Django below.
    location /public-policy/ {
        proxy_pass http://acpwb_go;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 8090;
    server_name _;

    location /ws/ {
        proxy_pass http://botseed_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://botseed_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    location / {
        root /botseed;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
}
