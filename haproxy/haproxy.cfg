global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Local-dev-only self-signed cert (see Dockerfile) — production TLS keeps
# living on host nginx via certbot; this frontend exists purely so
# `docker compose -f docker-compose-local.yml up` can exercise the
# JA3/JA4-capture path end-to-end without needing real certs or DNS.
#
# HAProxy owns TLS termination and fingerprint capture ONLY — every other
# responsibility (archive/policy dispatch, static files, gzip, WebSocket
# proxying) stays on the existing nginx service, reached here as a plain-HTTP
# backend. See the plan this implements for why the routing logic
# deliberately does not move into HAProxy ACLs.
frontend fe_edge
    bind *:8001 ssl crt /usr/local/etc/haproxy/certs/combined.pem alpn h2,http/1.1

    # TLS protocol/cipher — the same signal nginx forwards via
    # X-TLS-Protocol/X-TLS-Cipher when nginx itself terminates TLS (see
    # nginx/acpwb.com). Once HAProxy is the terminator, this is the
    # authoritative source instead.
    http-request set-header X-TLS-Protocol %[ssl_fc_protocol]
    http-request set-header X-TLS-Cipher   %[ssl_fc_cipher]
    # Coarser than nginx's $server_protocol ("HTTP/1.1"/"HTTP/2.0") — only
    # the major version is available here — hence
    # apps.core.reputation_scoring checking a "HTTP/1" prefix rather than an
    # exact "HTTP/1.1" match, so this signal means the same thing regardless
    # of which layer captured it.
    http-request set-header X-Client-Protocol HTTP/%[fc_http_major]

    # NOTE — JA3/JA4 ClientHello fingerprinting, the strongest single
    # residential-proxy signal, is NOT implemented here. The plan this
    # frontend was built from assumed HAProxy has native req.ssl_ja3/
    # req.ssl_ja4 fetches; verifying against the actual 3.0.27 binary (see
    # haproxy/Dockerfile) showed that's wrong — those fetches don't exist in
    # open-source HAProxy at all (`haproxy -c` rejects them with "unknown
    # fetch method"; only HAProxy Enterprise, a paid product, has JA3/JA4).
    # This frontend still earns its place for the TLS-protocol/cipher/HTTP-
    # version signal below (real, confirmed-working fetches), but actual
    # JA3/JA4 capture needs either HAProxy Enterprise or a custom ClientHello
    # parser (e.g. nginx's stream module + njs, or a Go TCP-layer parser
    # ahead of nginx) — a separate, not-yet-built project.
    default_backend be_nginx

backend be_nginx
    server nginx nginx:80
