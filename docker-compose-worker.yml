services:
  web:
    build:
      context: ./acpwb
      dockerfile: Dockerfile.worker
    command: >
      sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gevent --workers 18 --worker-connections 100 --timeout 60"
    volumes:
      - ./acpwb:/app
      - ./acpwb/staticfiles:/app/staticfiles
    env_file: .env
    ports:
      - "0.0.0.0:8000:8000"
