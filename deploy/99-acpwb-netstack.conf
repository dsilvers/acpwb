# Raise listen/SYN backlog capacity to match nginx's `listen ... backlog=65535`
# (set in nginx/acpwb.com). Without this, nginx's accept queue is capped at the
# default 511 regardless of these values, and gets silently overwhelmed by
# scanner/crawler traffic bursts — visible as `netstat -s` showing "times the
# listen queue of a socket overflowed" / "SYNs to LISTEN sockets dropped".
#
# Install with:
#   sudo cp deploy/99-acpwb-netstack.conf /etc/sysctl.d/
#   sudo sysctl -p /etc/sysctl.d/99-acpwb-netstack.conf
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
