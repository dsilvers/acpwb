services:
  db:
    image: timescale/timescaledb:latest-pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: acpwb
      POSTGRES_USER: acpwb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acpwb_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acpwb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./acpwb
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py loaddata fortune500 --app public 2>/dev/null || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gevent --workers 4 --worker-connections 100 --timeout 60"
    volumes:
      - ./acpwb:/app
      - ./acpwb/staticfiles:/app/staticfiles
      - hf_cache:/root/.cache/huggingface
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  ws:
    build:
      context: ./ws_service
    environment:
      REDIS_URL: redis://redis:6379/0
      WS_PORT: "8765"
      STREAM_WS_TOKEN: ${STREAM_WS_TOKEN:-}
    expose:
      - "8765"
    depends_on:
      - redis
    restart: unless-stopped

  botseed_ws:
    build:
      context: ./botseed_service
    environment:
      REDIS_URL: redis://redis:6379/0
      WS_PORT: "8766"
      API_PORT: "8767"
      BOTSEED_WS_TOKEN: ${BOTSEED_WS_TOKEN:-}
    ports:
      - "127.0.0.1:8766:8766"
      - "127.0.0.1:8767:8767"
    depends_on:
      - redis
    restart: unless-stopped

  botseed_processor:
    build:
      context: ./acpwb
      dockerfile: Dockerfile
    command: python manage.py botseed_processor
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./acpwb/staticfiles:/app/staticfiles:ro
      - ./botseed:/botseed:ro
    ports:
      - "127.0.0.1:8001:80"
      - "127.0.0.1:8090:8090"
    depends_on:
      - web
      - ws
      - botseed_ws

volumes:
  postgres_data:
  hf_cache:
